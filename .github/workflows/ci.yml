name: CI Test Suite

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    name: Test & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true

      - name: Install templ CLI
        run: go install github.com/a-h/templ/cmd/templ@v0.2.778

      - name: Generate Templates
        run: templ generate

      - name: Run Tests with Race Detector
        run: go test -v -race -coverprofile=coverage.txt -covermode=atomic ./...

      - name: Verify Binary Builds
        run: |
          mkdir -p bin
          go build -v -o bin/server cmd/server/main.go
          go build -v -o bin/worker cmd/worker/main.go
          go build -v -o bin/make cmd/make/main.go
